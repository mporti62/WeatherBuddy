<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#7ab6e8"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#fff33b"/>
      <stop offset="5%" stop-color="#fdc70c"/>
      <stop offset="100%" stop-color="#f89b29"/>
    </radialGradient>
    <filter id="cloud-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="400" height="300" fill="url(#sky)"/>
  
  <circle cx="70" cy="70" r="40" fill="url(#sun)"/>
  
  <g transform="translate(120, 80)" filter="url(#cloud-shadow)">
    <ellipse cx="0" cy="0" rx="40" ry="20" fill="white"/>
    <ellipse cx="30" cy="-10" rx="30" ry="15" fill="white"/>
    <ellipse cx="-30" cy="0" rx="25" ry="12" fill="white"/>
    <ellipse cx="0" cy="-15" rx="35" ry="18" fill="white"/>
  </g>
  
  <g transform="translate(260, 100)" filter="url(#cloud-shadow)">
    <ellipse cx="0" cy="0" rx="50" ry="25" fill="white"/>
    <ellipse cx="40" cy="-15" rx="35" ry="17" fill="white"/>
    <ellipse cx="-40" cy="0" rx="30" ry="15" fill="white"/>
    <ellipse cx="0" cy="-20" rx="45" ry="22" fill="white"/>
  </g>
  
  <!-- Rain drops -->
  <g fill="#2980b9" opacity="0.7">
    <path d="M150,180 L145,210 L155,210 Z"/>
    <path d="M170,170 L165,200 L175,200 Z"/>
    <path d="M190,175 L185,205 L195,205 Z"/>
    <path d="M210,180 L205,210 L215,210 Z"/>
    <path d="M230,170 L225,200 L235,200 Z"/>
    <path d="M250,175 L245,205 L255,205 Z"/>
  </g>
  
  <!-- Temperature display -->
  <g transform="translate(330, 30)">
    <rect x="-20" y="0" width="40" height="80" rx="10" ry="10" fill="white" stroke="#2c3e50" stroke-width="2"/>
    <line x1="-10" y1="20" x2="10" y2="20" stroke="#e74c3c" stroke-width="2"/>
    <line x1="-10" y1="40" x2="10" y2="40" stroke="#e74c3c" stroke-width="2"/>
    <line x1="-10" y1="60" x2="10" y2="60" stroke="#e74c3c" stroke-width="2"/>
    <rect x="-5" y="25" width="10" height="40" rx="5" ry="5" fill="#e74c3c"/>
  </g>
  
  <!-- Mountains in the background -->
  <path d="M0,300 L100,200 L150,250 L200,150 L300,230 L350,180 L400,220 L400,300 Z" fill="#3a8c67" />
  <path d="M0,300 L80,220 L120,260 L180,180 L250,250 L320,200 L400,250 L400,300 Z" fill="#2ecc71" />
</svg>