<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="building-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <linearGradient id="steps-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecf0f1"/>
      <stop offset="100%" stop-color="#bdc3c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with sky -->
  <rect width="400" height="300" fill="#3498db"/>
  <rect y="150" width="400" height="150" fill="#2c3e50"/>
  
  <!-- Bank building -->
  <g transform="translate(100, 40)" filter="url(#shadow)">
    <!-- Building structure -->
    <rect x="20" y="60" width="160" height="140" fill="url(#building-grad)"/>
    
    <!-- Roof/Pediment -->
    <path d="M0,60 L200,60 L100,10 Z" fill="#f1c40f"/>
    
    <!-- Steps -->
    <rect x="40" y="180" width="120" height="5" fill="url(#steps-grad)"/>
    <rect x="45" y="185" width="110" height="5" fill="url(#steps-grad)"/>
    <rect x="50" y="190" width="100" height="5" fill="url(#steps-grad)"/>
    <rect x="55" y="195" width="90" height="5" fill="url(#steps-grad)"/>
    
    <!-- Columns -->
    <g fill="#ecf0f1">
      <rect x="35" y="60" width="15" height="120" rx="2" ry="2"/>
      <rect x="75" y="60" width="15" height="120" rx="2" ry="2"/>
      <rect x="115" y="60" width="15" height="120" rx="2" ry="2"/>
      <rect x="155" y="60" width="15" height="120" rx="2" ry="2"/>
      
      <!-- Column caps -->
      <rect x="30" y="60" width="25" height="5" rx="1" ry="1"/>
      <rect x="30" y="65" width="25" height="3" rx="1" ry="1"/>
      
      <rect x="70" y="60" width="25" height="5" rx="1" ry="1"/>
      <rect x="70" y="65" width="25" height="3" rx="1" ry="1"/>
      
      <rect x="110" y="60" width="25" height="5" rx="1" ry="1"/>
      <rect x="110" y="65" width="25" height="3" rx="1" ry="1"/>
      
      <rect x="150" y="60" width="25" height="5" rx="1" ry="1"/>
      <rect x="150" y="65" width="25" height="3" rx="1" ry="1"/>
      
      <!-- Column bases -->
      <rect x="30" y="175" width="25" height="5" rx="1" ry="1"/>
      <rect x="70" y="175" width="25" height="5" rx="1" ry="1"/>
      <rect x="110" y="175" width="25" height="5" rx="1" ry="1"/>
      <rect x="150" y="175" width="25" height="5" rx="1" ry="1"/>
    </g>
    
    <!-- Door -->
    <rect x="85" y="130" width="30" height="50" fill="#2c3e50"/>
    <line x1="100" y1="130" x2="100" y2="180" stroke="#ecf0f1" stroke-width="1"/>
    <circle cx="95" cy="155" r="2" fill="#f1c40f"/>
    <circle cx="105" cy="155" r="2" fill="#f1c40f"/>
    
    <!-- Bank sign -->
    <rect x="60" y="90" width="80" height="30" rx="5" ry="5" fill="#2c3e50"/>
    <text x="100" y="110" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#f1c40f" font-weight="bold">BANCO</text>
  </g>
  
  <!-- ATM Machine -->
  <g transform="translate(30, 180)">
    <rect width="40" height="60" rx="3" ry="3" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
    <rect x="5" y="10" width="30" height="20" fill="#3498db"/>
    <rect x="10" y="35" width="20" height="3" fill="#7f8c8d"/>
    <rect x="10" y="40" width="20" height="3" fill="#7f8c8d"/>
    <rect x="10" y="45" width="20" height="3" fill="#7f8c8d"/>
    <circle cx="20" cy="55" r="3" fill="#e74c3c"/>
  </g>
  
  <!-- Money/Coins -->
  <g transform="translate(340, 200)">
    <circle cx="0" cy="0" r="15" fill="#f1c40f" stroke="#f39c12" stroke-width="1"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#e67e22" font-weight="bold">$</text>
  </g>
  
  <g transform="translate(320, 220)">
    <circle cx="0" cy="0" r="12" fill="#f1c40f" stroke="#f39c12" stroke-width="1"/>
    <text x="0" y="4" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e67e22" font-weight="bold">$</text>
  </g>
  
  <g transform="translate(350, 230)">
    <circle cx="0" cy="0" r="10" fill="#f1c40f" stroke="#f39c12" stroke-width="1"/>
    <text x="0" y="3" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e67e22" font-weight="bold">$</text>
  </g>
  
  <!-- People -->
  <g transform="translate(260, 230)">
    <!-- Person 1 -->
    <circle cx="0" cy="0" r="7" fill="#3498db"/> <!-- Head -->
    <rect x="-1.5" y="7" width="3" height="12" fill="#2980b9"/> <!-- Body -->
    <line x1="-1.5" y1="10" x2="-5" y2="15" stroke="#2980b9" stroke-width="2"/> <!-- Left arm -->
    <line x1="1.5" y1="10" x2="5" y2="15" stroke="#2980b9" stroke-width="2"/> <!-- Right arm -->
    <line x1="-1.5" y1="19" x2="-3" y2="30" stroke="#34495e" stroke-width="2"/> <!-- Left leg -->
    <line x1="1.5" y1="19" x2="3" y2="30" stroke="#34495e" stroke-width="2"/> <!-- Right leg -->
  </g>
  
  <g transform="translate(280, 220)">
    <!-- Person 2 -->
    <circle cx="0" cy="0" r="6" fill="#e74c3c"/> <!-- Head -->
    <rect x="-1.5" y="6" width="3" height="10" fill="#c0392b"/> <!-- Body -->
    <line x1="-1.5" y1="9" x2="-5" y2="7" stroke="#c0392b" stroke-width="1.5"/> <!-- Left arm -->
    <line x1="1.5" y1="9" x2="5" y2="7" stroke="#c0392b" stroke-width="1.5"/> <!-- Right arm -->
    <path d="M-1.5,16 L-3,25 C-3,25 -3,27 -1,27 C1,27 1,25 1,25 L1.5,16" fill="#34495e"/> <!-- Skirt -->
    <line x1="-2" y1="27" x2="-2" y2="32" stroke="#34495e" stroke-width="1.5"/> <!-- Left leg -->
    <line x1="0" y1="27" x2="0" y2="32" stroke="#34495e" stroke-width="1.5"/> <!-- Right leg -->
    <rect x="-6" y="6" width="12" height="2" fill="#c0392b"/> <!-- Purse -->
  </g>
</svg>